services:
  omninews-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omninews_web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL}
      - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
    env_file:
      - .env
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1/",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - omninews-network

networks:
  omninews-network:
    driver: bridge
